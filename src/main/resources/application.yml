spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/nto_team}
    username: ${DB_USER:nto}
    password: ${DB_PASSWORD:nto}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: Europe/Moscow
  sql:
    init:
      mode: never
  liquibase:
    change-log: classpath:db/changelog/master.yaml
  jackson:
    default-property-inclusion: always
    time-zone: Europe/Moscow
    serialization:
      write-dates-as-timestamps: false
server:
  port: ${SERVER_PORT:8080}
